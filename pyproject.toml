[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shokitora"
version = "0.1.3"
description = "Shokitora (書記虎) - The Sovereign Tiger Scribe & Agentic Release Control Plane"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "Vincent Capers Jr.", email = "vincent@voncasper.com" }
]
keywords = [
    "agentic-ai",
    "developer-tools",
    "git-hooks",
    "secrets-manager",
    "hardware-bound",
    "release-management",
    "scribe",
    "journaling",
    "shokitora"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "cryptography>=41.0.0"
]

[project.urls]
Homepage = "https://github.com/voncasper/shokitora"
Documentation = "https://github.com/voncasper/shokitora#readme"
Repository = "https://github.com/voncasper/shokitora.git"
Issues = "https://github.com/voncasper/shokitora/issues"

[project.scripts]
shoki = "shokitora.cli.main:main"
shokitora = "shokitora.cli.main:main"
scribe = "shokitora.cli.main:main"
ctp = "shokitora.cli.commands_ctp:main"
scribe-vault = "shokitora.cli.commands_vault:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shokitora*"]

[tool.setuptools.package-data]
shokitora = [
    "hooks/*.sh",
    "skills/**/*"
]

[tool.coverage.run]
source = ["shokitora"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]


